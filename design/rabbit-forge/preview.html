<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>토끼 동작 미리보기</title><style>
body{margin:0;background:#0D0F13;color:#F4F4F1;font-family:sans-serif}h1{font-size:18px;margin:16px 24px}
main{display:flex;flex-wrap:wrap;gap:12px;padding:0 24px 24px}figure{margin:0;text-align:center}
canvas{width:384px;height:352px;image-rendering:pixelated}figcaption{color:#8A909B;font-size:15px}
</style></head><body><h1>토끼 레이서 동작 9종 (2배 확대)</h1><main><figure><canvas data-a="IDLE" width="192" height="176"></canvas><figcaption>idle</figcaption></figure><figure><canvas data-a="WIN" width="192" height="176"></canvas><figcaption>win</figcaption></figure><figure><canvas data-a="OVERTAKE" width="192" height="176"></canvas><figcaption>overtake</figcaption></figure><figure><canvas data-a="PIT" width="192" height="176"></canvas><figcaption>pit</figcaption></figure><figure><canvas data-a="RADIO" width="192" height="176"></canvas><figcaption>radio</figcaption></figure><figure><canvas data-a="LOAD" width="192" height="176"></canvas><figcaption>load</figcaption></figure><figure><canvas data-a="WELCOME" width="192" height="176"></canvas><figcaption>welcome</figcaption></figure><figure><canvas data-a="NOD" width="192" height="176"></canvas><figcaption>nod</figcaption></figure><figure><canvas data-a="POINT" width="192" height="176"></canvas><figcaption>point</figcaption></figure></main><script>
const M={"IDLE": {"frames": ["rabbit_idle_00.png", "rabbit_idle_01.png", "rabbit_idle_02.png", "rabbit_idle_03.png"], "durations_ms": [500, 500, 500, 140], "loop": true}, "WIN": {"frames": ["rabbit_win_00.png", "rabbit_win_01.png", "rabbit_win_02.png", "rabbit_win_03.png"], "durations_ms": [140, 220, 220, 180], "loop": true}, "OVERTAKE": {"frames": ["rabbit_overtake_00.png", "rabbit_overtake_01.png", "rabbit_overtake_02.png", "rabbit_overtake_03.png"], "durations_ms": [90, 90, 90, 90], "loop": true}, "PIT": {"frames": ["rabbit_pit_00.png"], "durations_ms": [800], "loop": true}, "RADIO": {"frames": ["rabbit_radio_00.png", "rabbit_radio_01.png"], "durations_ms": [220, 220], "loop": true}, "LOAD": {"frames": ["rabbit_load_00.png", "rabbit_load_01.png"], "durations_ms": [170, 170], "loop": true}, "WELCOME": {"frames": ["rabbit_welcome_00.png", "rabbit_welcome_01.png"], "durations_ms": [420, 220], "loop": true}, "NOD": {"frames": ["rabbit_nod_00.png", "rabbit_nod_01.png"], "durations_ms": [300, 300], "loop": true}, "POINT": {"frames": ["rabbit_point_00.png"], "durations_ms": [800], "loop": true}};
document.querySelectorAll('canvas').forEach(c=>{const m=M[c.dataset.a],g=c.getContext('2d');g.imageSmoothingEnabled=false;
const im=m.frames.map(f=>{const i=new Image();i.src='frames/'+f;return i});let k=0;
const step=()=>{g.clearRect(0,0,c.width,c.height);if(im[k].complete)g.drawImage(im[k],0,0);const d=m.durations_ms[k];k=(k+1)%im.length;setTimeout(step,d)};step()});
</script></body></html>
