<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주행 중</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: var(--asphalt-deep); color: #C9CDD2; }
  .rec { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 14px; font-size: 26px; color: var(--grey); }
  .rec i { width: 16px; height: 16px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 12px rgba(255, 197, 46, .8); }
  h1 { position: absolute; left: 80px; top: 176px; margin: 0; font-weight: 900; font-size: 84px; color: var(--white); line-height: 1.1; letter-spacing: -.02em; }
  .sub { position: absolute; left: 84px; top: 290px; font-size: 30px; color: var(--grey); }
  .sil { position: absolute; right: 70px; top: 300px; width: 480px; height: 176px; opacity: .16; }
  .wrap { position: absolute; left: 80px; right: 80px; bottom: 150px; height: 44px; }
  .track { position: absolute; inset: 0; display: flex; gap: 6px; }
  .track span { flex: 1; background: linear-gradient(180deg, #30343B, #262A30); border-top: 1px solid rgba(255, 255, 255, .06); }
  .track span.on { background: linear-gradient(180deg, #FFD65C, var(--yellow) 60%, #D9A21A); opacity: .85; box-shadow: 0 0 14px rgba(255, 197, 46, .25); }
  .track span.flag { flex: 0 0 60px; background: repeating-conic-gradient(#C9CDD2 0 25%, #2B2F35 0 50%) 0 0/22px 22px; }
  .qlabel { position: absolute; top: -46px; left: 0; border-bottom: 3px solid #6B6750; font-size: 24px; color: var(--grey); padding-bottom: 6px; white-space: nowrap; }
  .car { position: absolute; top: -36px; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .5)); }
  .meta { position: absolute; left: 80px; right: 80px; bottom: 72px; display: flex; justify-content: space-between; font-size: 26px; color: var(--grey); }
  .meta b { font-size: 42px; color: var(--white); margin-right: 8px; }
  .meta .streak { color: var(--yellow); }
  /* 날씨 배경: 차량 신호(와이퍼·외기온도·전조등)로 정한 정지 그림. 움직임 없음, 날씨가 바뀔 때만 교체 */
  .wx { position: absolute; inset: 0; }
  .wx svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wx.sun { background: radial-gradient(circle at 88% -6%, rgba(255, 197, 46, .20), rgba(255, 197, 46, .06) 28%, transparent 48%),
    linear-gradient(180deg, rgba(150, 175, 205, .07), transparent 50%); }
  .wx.rain { background: linear-gradient(180deg, rgba(95, 125, 165, .20), transparent 62%),
    linear-gradient(0deg, rgba(150, 185, 230, .07), transparent 22%); }
  .wx.snow { background: linear-gradient(180deg, rgba(190, 210, 235, .14), transparent 60%); }
  .wx.night { background: radial-gradient(circle at 86% 14%, rgba(200, 210, 235, .10), transparent 30%),
    linear-gradient(180deg, rgba(10, 14, 30, .55), transparent 70%); }
  .rec .wxname { color: var(--grey); }
  .rec .wxname::before { content: '·'; margin-right: 14px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true" style="opacity:.5"></div>
<div class="wx" id="wx" aria-hidden="true"></div>
<svg class="sil" viewBox="0 0 4800 1760" fill="none" stroke="#F2F1EC" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
<path vector-effect="non-scaling-stroke" d="M130 1500 L505 1500 A450 450 0 1 1 1345 1500 L3505 1500 A450 450 0 1 1 4345 1500 L4680 1500 L4712 1180 L4700 760 L3420 640 L2660 112 L860 96 L205 128 L92 560 L86 1150 Z"/>
<path vector-effect="non-scaling-stroke" d="M3230 680 L2630 218 L700 205 L335 640 Z"/>
<path vector-effect="non-scaling-stroke" d="M2085 212 V700 M1150 207 L1030 680"/>
<path vector-effect="non-scaling-stroke" d="M3290 690 V1440 M2085 700 V1440 M1180 690 C1240 900 1300 1200 1330 1430"/>
<path vector-effect="non-scaling-stroke" d="M3260 1290 L1460 1000"/>
<path vector-effect="non-scaling-stroke" d="M4560 860 H4705 M4560 900 H4705 M96 340 H230 M96 372 H230"/>
<path vector-effect="non-scaling-stroke" d="M3230 630 l-150 -20 l-20 70 l160 10 z"/>
<circle vector-effect="non-scaling-stroke" cx="925" cy="1340" r="360"/><circle vector-effect="non-scaling-stroke" cx="925" cy="1340" r="250"/><circle vector-effect="non-scaling-stroke" cx="925" cy="1340" r="60"/>
<circle vector-effect="non-scaling-stroke" cx="3925" cy="1340" r="360"/><circle vector-effect="non-scaling-stroke" cx="3925" cy="1340" r="250"/><circle vector-effect="non-scaling-stroke" cx="3925" cy="1340" r="60"/>
<path vector-effect="non-scaling-stroke" d="M0 1740 H4800" stroke-dasharray="14 10"/>
</svg>
<div class="rec"><i></i>주행 기록 중<span class="wxname" id="wxname"></span></div>
<h1>오늘의 레이스 진행 중</h1>
<div class="sub">결과는 주차하면 공개돼요</div>
<div class="wrap">
  <div class="qlabel">3km부터 기록 인정</div>
  <div class="track skew" id="track" aria-hidden="true"></div>
  <svg class="car" width="70" height="32" viewBox="0 0 64 30" aria-hidden="true">
    <defs><linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E4E2DB"/><stop offset="1" stop-color="#A9A7A0"/></linearGradient></defs>
    <path d="M4 20c0-5 3-9 9-10l8-1 6-6h14l8 6 9 2c3 1 4 4 4 7v2H4z" fill="url(#cb)"/>
    <path d="M24 9l5-4h7v4zM38 5h3l5 4h-8z" fill="#1E2125"/>
    <circle cx="16" cy="23" r="5" fill="#1E2125" stroke="#F2F1EC" stroke-width="2.5"/>
    <circle cx="48" cy="23" r="5" fill="#1E2125" stroke="#F2F1EC" stroke-width="2.5"/>
    <rect x="56" y="13" width="6" height="3" rx="1.5" fill="#FFC52E"/>
  </svg>
</div>
<div class="meta">
  <span><b class="num" data-bind="done"></b>/ <span data-bind="dest"></span></span>
  <span class="streak" data-bind="goal"></span>
</div>

<script src="demo-data.js"></script>
<script src="page.js"></script>
<script>
  const DONE = 11.2, DEST = DEMO.trips.find(t => t.date === '2026-11-07').km, QUALIFY = 3;
  const cells = Math.ceil(DEST), on = Math.floor(DONE);
  const track = document.getElementById('track');
  track.innerHTML = Array.from({ length: cells }, (_, i) => `<span class="${i < on ? 'on' : ''}"></span>`).join('') + '<span class="flag"></span>';

  // 자동차는 마지막으로 채운 칸 끝, "3km" 표시는 앞 3칸 위
  const spans = track.querySelectorAll('span');
  const wrap = track.parentElement.getBoundingClientRect();
  const car = document.querySelector('.car');
  car.style.left = (spans[on - 1].getBoundingClientRect().right - wrap.left - 40) + 'px';
  document.querySelector('.qlabel').style.width = (spans[QUALIFY - 1].getBoundingClientRect().right - wrap.left) + 'px';

  const vals = { done: DONE, dest: DEST + 'km · 해운대까지', goal: '안전하게, 다음 한 칸까지' };
  for (const el of document.querySelectorAll('[data-bind]')) el.textContent = vals[el.dataset.bind];

  // 날씨: ?w=sun|rain|snow|night. 앱에서는 와이퍼 작동=비, 외기 0℃ 이하+와이퍼=눈, 전조등·해진 뒤=밤, 그 밖=맑음.
  // 빗줄기·눈송이는 고정 시드로 한 번만 그린다(움직이지 않음). 글자가 있는 왼쪽 위·트랙 줄은 비워 둔다.
  const W = { sun: '맑음', rain: '비', snow: '눈', night: '밤' };
  const w = W[new URLSearchParams(location.search).get('w')] ? new URLSearchParams(location.search).get('w') : 'sun';
  const wx = document.getElementById('wx');
  wx.className = 'wx ' + w;
  document.getElementById('wxname').textContent = W[w];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const clear = (x, y) => (x < 820 && y > 150 && y < 340) || (y > 480 && y < 640);
  let g = '';
  if (w === 'rain') for (let i = 0; i < 140; i++) {
    const x = rnd() * 1300, y = rnd() * 700, l = 18 + rnd() * 26;
    if (!clear(x, y)) g += `<line x1="${x}" y1="${y}" x2="${x - l * .27}" y2="${y + l}" stroke="#C8D6EA" stroke-opacity="${.12 + rnd() * .14}" stroke-width="2" stroke-linecap="round"/>`;
  }
  if (w === 'snow') for (let i = 0; i < 110; i++) {
    const x = rnd() * 1280, y = rnd() * 720, r = 1.5 + rnd() * 3.5;
    if (!clear(x, y)) g += `<circle cx="${x}" cy="${y}" r="${r}" fill="#F2F1EC" fill-opacity="${.18 + rnd() * .3}"/>`;
  }
  if (w === 'night') {
    for (let i = 0; i < 40; i++) {
      const x = 600 + rnd() * 680, y = rnd() * 260;
      if (!clear(x, y)) g += `<circle cx="${x}" cy="${y}" r="${.8 + rnd() * 1.4}" fill="#F2F1EC" fill-opacity="${.2 + rnd() * .4}"/>`;
    }
    g += '<mask id="m"><circle cx="1100" cy="100" r="34" fill="#fff"/><circle cx="1116" cy="88" r="30" fill="#000"/></mask><circle cx="1100" cy="100" r="34" fill="#E8E6DF" fill-opacity=".55" mask="url(#m)"/>';
  }
  if (w === 'sun') g = '<circle cx="1126" cy="-10" r="70" fill="#FFC52E" fill-opacity=".10"/>';
  wx.innerHTML = `<svg viewBox="0 0 1280 720">${g}</svg>`;
  finishPage();
</script>
</body>
</html>
