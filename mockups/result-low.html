<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주행 결과 — 아쉬운 날</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .top { position: absolute; left: 64px; top: 48px; font-size: 26px; font-weight: 800; color: var(--grey); }
  .note { position: absolute; right: 64px; bottom: 26px; font-size: 24px; color: var(--grey); }
  .score { position: absolute; left: 50px; top: 78px; font-size: 300px; line-height: .86; letter-spacing: -6px; }
  .score small { font-family: 'Pretendard'; font-style: normal; font-weight: 800; font-size: 72px; letter-spacing: 0; margin-left: 16px; -webkit-text-fill-color: var(--grey); }
  /* 엔지니어가 든 피트 보드: 그림 속 빈 보드(가로 14~86%, 세로 39~56%) 위에 한 단어 */
  .crewbox { position: absolute; left: 436px; top: 70px; height: 380px; width: 221px; }
  .crewbox .crew { position: static; height: 100%; }
  .crewbox .word { position: absolute; left: 8%; right: 8%; top: 51%; height: 22%; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 900; color: var(--asphalt-deep); }
  .pit { position: absolute; left: 64px; top: 468px; width: 600px; color: var(--asphalt-deep); padding: 20px 28px 22px; border-radius: 10px;
    background-color: var(--yellow); background-image: linear-gradient(135deg, #FFD65C, var(--yellow) 60%, #F2B312); box-shadow: 0 16px 36px rgba(255, 197, 46, .22); }
  .pit .h { font-size: 24px; display: flex; align-items: center; gap: 10px; }
  .pit .m { font-size: 36px; font-weight: 900; line-height: 1.2; margin-top: 4px; white-space: nowrap; }
  .pit .r { display: flex; justify-content: space-between; margin-top: 12px; font-size: 24px; border-top: 2px solid rgba(27, 30, 35, .5); padding-top: 10px; }
  .stats { position: absolute; left: 720px; bottom: 60px; display: flex; gap: 40px; font-size: 24px; color: var(--grey); }
  .stats b { display: block; font-size: 46px; line-height: 1.05; color: var(--white); }
  .stats b.broken { color: var(--grey); }
  .stats .again { font-size: 24px; color: var(--yellow); }
  .tower { position: absolute; right: 64px; top: 48px; width: 520px; }
  .tower h4 { margin: 0 0 14px; font-weight: 700; font-size: 24px; color: var(--grey); display: flex; justify-content: space-between; padding: 0 14px; }
  .tower .row { grid-template-columns: 112px minmax(0, 1fr) auto 84px; height: 60px; }
  .tower .row .n { font-size: 25px; }
  .tower .row .s { font-size: 32px; }
  .tower .row.me { height: 74px; margin: 10px 0 10px -28px; background-color: var(--white); background-image: linear-gradient(180deg, #FFFFFF, #E4E2DB); box-shadow: 0 10px 28px rgba(0, 0, 0, .35); }
  .tower .row.me .p { font-size: 44px; }
  .tower .row.target { border: 2px dashed var(--yellow); }
  .tower .tag { background: var(--yellow); color: var(--asphalt-deep); }
  .gap { font-size: 24px; color: var(--yellow); margin: 2px 0 8px 10px; }
</style>
</head>
<body>
<div class="bg streak" aria-hidden="true"></div>
<svg id="route" aria-hidden="true" style="position:absolute;left:-30px;top:110px;width:720px;height:432px"></svg>
<div class="kerb muted" aria-hidden="true"></div><div class="kerb t muted" aria-hidden="true"></div>
<div class="top">아이오닉 5 리그 · 오늘의 레이스 종료</div>
<div class="note">다른 날의 예시</div>
<div class="score num metal dull">64<small>점</small></div>

<div class="crewbox" aria-hidden="true"><img class="crew" src="character/png/pit-board.png" alt=""><span class="word">깜빡이!</span></div>
<div class="pit">
  <div class="h"><span class="face" aria-hidden="true"></span>피트 보드 · 다음 주행 작전</div>
  <div class="m">차선 바꿀 때 깜빡이부터 켜기</div>
  <div class="r"><span>오늘 깜빡이 없이 차선 변경 4회</span><span>매너 +9점 가능</span></div>
</div>

<div class="stats">
  <div>연속 안전 주행 (70점 이상)<b class="num broken">13일 → 0일</b><span class="again">다음 주행 70점이면 1일부터 다시</span></div>
  <div>주행 거리<b class="num">22.1km</b></div>
</div>

<a class="replay-btn" href="replay.html" style="right:64px;top:440px"><span>리플레이 보기</span><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></a>
<div class="tower">
  <h4><span>11월 시즌 순위</span><span>시즌 평균</span></h4>
  <div class="row dim"><span class="p num">P124</span><span class="n">깜빡이장인</span><span></span><span class="s num">89.1</span></div>
  <div class="row target"><span class="p num">P125</span><span class="n">해운대드라이버</span><span><span class="tag">목표</span></span><span class="s num">88.7</span></div>
  <div class="gap">0.4점 차, 한 번만 잘 달리면 되찾아요</div>
  <div class="row me"><span class="p num">P126</span><span class="n">나 ▼1</span><span></span><span class="s num">88.3</span></div>
  <div class="row dim"><span class="p num">P127</span><span class="n">조용한퇴근</span><span></span><span class="s num">88.2</span></div>
</div>

<script src="demo-data.js"></script>
<script src="page.js"></script>
<script>drawRoute(document.getElementById('route')); finishPage();</script>
</body>
</html>
